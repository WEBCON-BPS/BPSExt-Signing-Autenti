name: Build .NET

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-2019

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 9.0.x       
    - name: Restore dependencies
      run: dotnet restore WebCon.BpsExt.Signing.Autenti.sln
    - name: Build
      run: dotnet build WebCon.BpsExt.Signing.Autenti.sln  --no-restore --configuration Release 
    - uses: actions/upload-artifact@v4
      with:
        name: WebCon.BpsExt.Signing.Autenti${{ matrix.runs-on }}
        path: |
          WebCon.BpsExt.Signing.Autenti/bin/Release/net9.0/WebCon.BpsExt.Signing.Autenti.dll
          WebCon.BpsExt.Signing.Autenti/bin/Release/net9.0/WebCon.BpsExt.Signing.Autenti.json
          WebCon.BpsExt.Signing.Autenti/bin/Release/net9.0/Newtonsoft.Json.dll
          
